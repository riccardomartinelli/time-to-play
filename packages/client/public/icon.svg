<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Time to Play</title>
  <!-- Same drawing as src/components/GameIcon.tsx. The outline turns cream on dark browser chrome. -->
  <style>
    .o { stroke: #1B1B3A; }
    .f { fill: #1B1B3A; }
    @media (prefers-color-scheme: dark) {
      .o { stroke: #FFF4E0; }
      .f { fill: #FFF4E0; }
    }
  </style>
  <rect class="o" x="45" y="9" width="9" height="7" rx="2.5" fill="#FF5A5F" stroke-width="3" transform="rotate(45 49.5 12.5)"/>
  <rect class="f" x="29" y="10" width="6" height="6"/>
  <rect class="o" x="24.5" y="3" width="15" height="8" rx="3" fill="#FF5A5F" stroke-width="3"/>
  <circle class="f" cx="32" cy="40.5" r="21.5"/>
  <circle class="o" cx="32" cy="37" r="21.5" fill="#FFC93C" stroke-width="4"/>
  <g stroke="#1B1B3A" stroke-width="3" stroke-linecap="round">
    <line x1="32" y1="20" x2="32" y2="23.5"/>
    <line x1="49" y1="37" x2="45.5" y2="37"/>
    <line x1="32" y1="54" x2="32" y2="50.5"/>
    <line x1="15" y1="37" x2="18.5" y2="37"/>
  </g>
  <g stroke="#1B1B3A" stroke-width="4" stroke-linecap="round">
    <line x1="32" y1="37" x2="32" y2="25.5"/>
    <line x1="32" y1="37" x2="40.5" y2="31"/>
  </g>
  <circle cx="32" cy="37" r="3.5" fill="#FF5A5F" stroke="#1B1B3A" stroke-width="2.5"/>
</svg>

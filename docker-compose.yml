# Runs the whole game: open http://<host>:8080 on the phones.
services:
  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    image: time-to-play-server
    restart: unless-stopped
    environment:
      SERVER_PORT: "3001"

  client:
    build:
      context: .
      dockerfile: packages/client/Dockerfile
    image: time-to-play-client
    restart: unless-stopped
    environment:
      SERVER_URL: http://server:3001
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_healthy
